# Local stack: API + frontend. Neon and Pinecone stay remote, so backend/.env
# must point at a real project.
#
#   docker compose up --build
#   frontend -> http://localhost:5173,  API -> http://localhost:8000

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Same image as the API, different command. Ingestion is a separate process
  # so a deploy or crash of the API cannot destroy work in flight -- restarting
  # this one only returns its jobs to the queue.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    command: ["python", "worker.py"]
    restart: unless-stopped
    depends_on:
      - api

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Vite bakes this in at build time, so changing it needs a rebuild.
        # localhost resolves in the browser, not the container.
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
